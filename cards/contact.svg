<svg xmlns="http://www.w3.org/2000/svg" width="800" height="146" viewBox="0 0 800 146" role="img" aria-label="Building something in AI/ML or data engineering? Send me a note."><title>Building something in AI/ML or data engineering? Send me a note.</title><style>@font-face{font-family:'Inter';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Inter';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@keyframes fu{from{opacity:0;transform:translateY(10px)}}
@keyframes fi{from{opacity:0}}
@keyframes gr{from{transform:scaleY(0)}}
@keyframes sx{from{transform:scaleX(0)}}
@keyframes pp{from{opacity:0;transform:scale(.4)}}
@keyframes rg{from{stroke-dasharray:0 100}}
@keyframes dr{50%{transform:translate(26px,-12px)}}
.fu{animation:fu .7s cubic-bezier(.2,.7,.2,1) both}
.fi{animation:fi .6s ease-out both}
.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr .8s cubic-bezier(.2,.7,.2,1) both}
.sx{transform-box:fill-box;transform-origin:0 50%;animation:sx .7s cubic-bezier(.2,.7,.2,1) both}
.pp{transform-box:fill-box;transform-origin:center;animation:pp .35s ease-out both}
.rg{animation:rg 1.1s cubic-bezier(.2,.7,.2,1) both}
.dr{animation:dr 16s ease-in-out infinite}
.still{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}.still{display:inline}}
</style><defs><clipPath id="cp"><rect width="800" height="146" rx="10"/></clipPath></defs><rect width="800" height="146" rx="10" fill="#000000"/><rect x=".5" y=".5" width="799" height="145" rx="10" fill="none" stroke="#262626"/><text x="48" y="62" font-family="Inter,-apple-system,'Segoe UI',Roboto,sans-serif" font-weight="600" font-size="28" fill="#fafafa" text-anchor="start" letter-spacing="-0.4" class="fu" style="animation-delay:0.30s">Building something in AI/ML or data engineering?</text><g class="motion"><rect x="702" y="38" width="3" height="28" fill="#818cf8"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" begin="1.0s" repeatCount="indefinite"/></rect></g><g class="still"><rect x="702" y="38" width="3" height="28" fill="#818cf8" opacity="1"/></g><rect x="48" y="80" width="40" height="2" fill="#6366f1" class="sx" style="animation-delay:0.90s"/><text x="48" y="112" font-family="Inter,-apple-system,'Segoe UI',Roboto,sans-serif" font-weight="400" font-size="15" fill="#a1a1aa" text-anchor="start" class="fu" style="animation-delay:1.10s">Send me a note or connect. Tell me what you are working on.</text></svg>

xt><text x="666.6666666666666" y="90" font-family="Inter,-apple-system,'Segoe UI',Roboto,sans-serif" font-weight="800" font-size="34" fill="#fafafa" text-anchor="middle" class="fu" style="animation-delay:1.95s">6</text><text x="666.6666666666666" y="118" font-family="Inter,-apple-system,'Segoe UI',Roboto,sans-serif" font-weight="400" font-size="13" fill="#a1a1aa" text-anchor="middle" class="fu" style="animation-delay:2.00s">Longest streak, days</text><text x="666.6666666666666" y="140" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-weight="500" font-size="11" fill="#71717a" text-anchor="middle" class="fu" style="animation-delay:2.05s">Nov 14 to Nov 19</text></svg>
